name: CI

# Runs on every pull request, and on every push to main (e.g. a merge)
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Fails if any file isn't formatted — run `cargo fmt` locally to fix
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Lints the code and the tests; any warning fails the job
      # Run the same command locally to see and fix them
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Latest stable Rust — edition 2024 needs 1.85 or newer
      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and target/ between runs so builds stay fast
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
